name: Update DERP ruleset

on:
  schedule:
    # 每天 UTC 04:17 = 台北时间 12:17
    # 用非整点是为了避开 GitHub 定时任务在整点的拥堵（整点排队可能延迟十几分钟）
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    # 改了生成逻辑就立刻重跑一次，方便验证
    paths:
      - "scripts/gen_derp_ruleset.py"
      - ".github/workflows/update-ruleset.yml"

# 同一时间只允许一个运行，避免定时任务和手动触发撞车导致推送冲突
concurrency:
  group: update-ruleset
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # 钉到 commit SHA 而不是 @v7：tag 是可变的，上游仓库一旦被劫持，
        # 重新指向的 tag 会让任意代码拿到本仓库的 contents:write 权限。
        # Dependabot 认得这种"SHA + 版本注释"写法，照样会提 PR 升级。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 脚本只用 Python 标准库，不需要 setup-python 和 pip install。
      # 少一个 action 依赖，就少一个供应链风险面。
      - name: Show Python version
        run: python3 --version

      - name: Generate ruleset
        run: |
          python3 scripts/gen_derp_ruleset.py \
            --out-dir rules \
            --basename tailscale-derp
          # 想开启更多输出，把下面的参数加到上面这条命令后面：
          #   --emit-domains        额外输出 DERP 主机名的 DOMAIN 规则
          #   --split-regions       额外按大区生成 tailscale-derp-<group>.list
          #   --include-stun-only   包含 STUNOnly 节点（默认过滤）

      - name: Commit if changed
        # 只有 main 上的运行才回写。Dependabot 等分支上的 push 也会触发本
        # workflow，那时只跑生成逻辑当作一次校验，不往那些分支提交。
        if: github.ref_name == 'main'
        env:
          BRANCH: main
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先入暂存区再比对：git diff 看不到未跟踪的新文件，
          # 首次生成 rules/*.list 时会被误判成"无变化"而漏提交。
          git add -A rules/
          if git diff --cached --quiet -- rules/; then
            echo "规则无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: update DERP ruleset ($(date -u '+%Y-%m-%d'))"

          # push 事件触发的运行 checkout 的是它自己那个提交，跑到这一步时
          # main 可能已经往前走了，直推会被判非快进而失败。先 rebase 到最新
          # main 再推；本提交只动 rules/，rebase 不会有冲突。
          # 失败重试一次，覆盖"拉完到推之间又有新提交"的窄窗口。
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "已提交并推送更新"
              exit 0
            fi
            echo "推送被拒（第 $attempt 次），重新 rebase 后重试"
            sleep 5
          done
          echo "::error::连续 3 次推送失败，规则未能提交"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### DERP ruleset"
            echo
            if [ -f rules/tailscale-derp.list ]; then
              head -n 4 rules/tailscale-derp.list | sed 's/^# //'
              echo
              echo "规则行数: $(grep -cvE '^\s*(#|$)' rules/tailscale-derp.list)"
            else
              echo "规则文件尚未生成"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
